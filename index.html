<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <title>Access</title>
  <style id="gate-styles">
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: grid; place-items: center;
      -webkit-font-smoothing: antialiased;
    }
    .gate-card {
      width: min(380px, 92vw);
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 26px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .gate-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: rgba(56, 189, 248, 0.14); color: #38bdf8;
      display: grid; place-items: center; margin-bottom: 14px;
    }
    .gate-title { margin: 0 0 6px; font-size: 18px; font-weight: 650; letter-spacing: -0.015em; }
    .gate-sub { margin: 0 0 18px; font-size: 13px; color: #94a3b8; line-height: 1.45; }
    .gate-input {
      width: 100%; padding: 11px 12px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: #f8fafc;
      font-size: 15px; outline: none; margin-bottom: 12px;
    }
    .gate-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
    .gate-check {
      display: flex; align-items: center; gap: 8px;
      font-size: 12.5px; color: #cbd5e1; margin-bottom: 16px; cursor: pointer;
    }
    .gate-btn {
      width: 100%; padding: 11px 14px; border: none; border-radius: 8px;
      background: #0284c7; color: #ffffff; font-size: 14px; font-weight: 650;
      cursor: pointer; transition: background 140ms ease;
    }
    .gate-btn:hover:not(:disabled) { background: #0369a1; }
    .gate-btn:disabled { opacity: 0.6; cursor: wait; }
    .gate-err {
      margin-top: 12px; padding: 9px 11px; border-radius: 7px;
      background: rgba(239, 68, 68, 0.14); border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5; font-size: 12.5px; display: none;
    }
    .gate-foot { margin-top: 16px; font-size: 11.5px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <main class="gate-card">
    <div class="gate-icon" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1 class="gate-title">Private Workspace</h1>
    <p class="gate-sub">Client-side AES-256-GCM encrypted bundle. Enter your passphrase to decrypt locally on this device.</p>
    <form id="unlock-form" autocomplete="off">
      <input id="passphrase-input" class="gate-input" type="password" placeholder="Passphrase" autocomplete="current-password" required autofocus />
      <label class="gate-check">
        <input id="remember-device" type="checkbox" checked />
        <span>Stay unlocked on this device (local key only)</span>
      </label>
      <button id="unlock-btn" class="gate-btn" type="submit">Unlock Locally</button>
      <div id="gate-err" class="gate-err" role="alert"></div>
    </form>
    <div class="gate-foot">Decryption runs offline via Web Crypto. No server authentication or tracking.</div>
  </main>

  <script>
    (function () {
      'use strict';

      const DEVICE_KEY_STORAGE = 'vault_gate_aes_jwk_v1';
      let cachedEnvelope = null;
      let decryptedPayloadString = null;

      function fromB64(b64) {
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      function toB64(u8) {
        let bin = '';
        for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
        return btoa(bin);
      }

      async function loadEnvelope() {
        if (cachedEnvelope) return cachedEnvelope;
        const resp = await fetch('./payload.enc.json', { cache: 'no-cache' });
        if (!resp.ok) throw new Error('Encrypted payload missing');
        cachedEnvelope = await resp.json();
        return cachedEnvelope;
      }

      async function deriveAesKey(passphrase, saltBytes, iterations) {
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: saltBytes, iterations: iterations || 600000, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          true,
          ['decrypt', 'encrypt']
        );
      }

      async function decryptWithKey(aesKey, env) {
        const plainBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: fromB64(env.iv) },
          aesKey,
          fromB64(env.ct)
        );
        return new TextDecoder().decode(plainBuf);
      }

      function mountDecryptedApp(plainJson) {
        decryptedPayloadString = plainJson;
        const payload = JSON.parse(plainJson);

        window.__VaultGate = {
          lock: function () {
            try { localStorage.removeItem(DEVICE_KEY_STORAGE); } catch (_) {}
            location.reload();
          },
          rotatePassphrase: async function (newPassphrase) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const iterations = 600000;
            const key = await deriveAesKey(newPassphrase, salt, iterations);
            const ctBuf = await crypto.subtle.encrypt(
              { name: 'AES-GCM', iv },
              key,
              new TextEncoder().encode(decryptedPayloadString)
            );
            const nextEnv = {
              v: 1,
              alg: 'AES-256-GCM',
              kdf: 'PBKDF2-SHA256',
              iterations,
              salt: toB64(salt),
              iv: toB64(iv),
              ct: toB64(new Uint8Array(ctBuf))
            };
            // Update remembered device key if already remembered
            try {
              if (localStorage.getItem(DEVICE_KEY_STORAGE)) {
                const jwk = await crypto.subtle.exportKey('jwk', key);
                localStorage.setItem(DEVICE_KEY_STORAGE, JSON.stringify({ salt: nextEnv.salt, jwk }));
              }
            } catch (_) {}
            const blob = new Blob([JSON.stringify(nextEnv, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'payload.enc.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }
        };

        const gateStyles = document.getElementById('gate-styles');
        if (gateStyles) gateStyles.remove();

        document.title = payload.title || 'Workspace';
        document.documentElement.setAttribute('data-theme', 'light');
        const styleEl = document.createElement('style');
        styleEl.textContent = payload.css;
        document.head.appendChild(styleEl);

        document.body.innerHTML = payload.bodyHtml;
        const scriptEl = document.createElement('script');
        scriptEl.textContent = payload.js;
        document.body.appendChild(scriptEl);
      }

      function showErr(msg) {
        const el = document.getElementById('gate-err');
        if (!el) return;
        el.textContent = msg;
        el.style.display = 'block';
      }

      // Attempt automatic local device unlock if previously remembered
      async function tryAutoUnlock() {
        try {
          const saved = JSON.parse(localStorage.getItem(DEVICE_KEY_STORAGE) || 'null');
          if (!saved || !saved.jwk) return;
          const env = await loadEnvelope();
          if (saved.salt !== env.salt) {
            localStorage.removeItem(DEVICE_KEY_STORAGE);
            return;
          }
          const key = await crypto.subtle.importKey('jwk', saved.jwk, { name: 'AES-GCM' }, false, ['decrypt']);
          const plain = await decryptWithKey(key, env);
          mountDecryptedApp(plain);
        } catch (_) {
          try { localStorage.removeItem(DEVICE_KEY_STORAGE); } catch (__) {}
        }
      }

      document.getElementById('unlock-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const input = document.getElementById('passphrase-input');
        const btn = document.getElementById('unlock-btn');
        const remember = document.getElementById('remember-device').checked;
        const pw = input.value;
        if (!pw) return;

        btn.disabled = true;
        btn.textContent = 'Decrypting...';
        document.getElementById('gate-err').style.display = 'none';

        try {
          const env = await loadEnvelope();
          const key = await deriveAesKey(pw, fromB64(env.salt), env.iterations);
          const plain = await decryptWithKey(key, env);
          if (remember) {
            const jwk = await crypto.subtle.exportKey('jwk', key);
            localStorage.setItem(DEVICE_KEY_STORAGE, JSON.stringify({ salt: env.salt, jwk }));
          } else {
            localStorage.removeItem(DEVICE_KEY_STORAGE);
          }
          mountDecryptedApp(plain);
        } catch (_) {
          btn.disabled = false;
          btn.textContent = 'Unlock Locally';
          input.select();
          showErr('Incorrect passphrase. Please try again.');
        }
      });

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      tryAutoUnlock();
    })();
  </script>
</body>
</html>
